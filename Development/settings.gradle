pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'WorldsReborn'

// Each folder is its own Minecraft mod (its own jar).
include 'core', 'interface', 'story', 'characters', 'abilities', 'worlds', 'travel', 'marvel'
